services:
  stacker:
    build: .
    environment:
      STACKER_ENV: development
      STACKER_DATA_DIR: /data
      STACKER_ADVERTISE_ADDR: ${STACKER_ADVERTISE_ADDR:-127.0.0.1}
    ports:
      - "8080:8080"
    volumes:
      - stacker-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  stacker-data:
