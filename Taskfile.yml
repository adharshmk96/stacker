version: '3'

vars:
  BIN: '{{.TASK_DIR}}/bin/stacker'

tasks:
  build:ui:
    desc: Build the Nuxt UI into stacker-server/internal/web/dist for embedding
    cmds:
      - bash scripts/build-ui.sh

  run:
    desc: Run the stacker server
    dir: stacker-server
    deps: [build:ui]
    cmds:
      - go run .

  vps:up:
    desc: Start 3 local test VPS nodes on ports 2201-2203 (stacker/stacker)
    cmds:
      - docker compose -f docker-compose.vps.yml up -d --build

  vps:down:
    desc: Stop and remove the local test VPS nodes
    cmds:
      - docker compose -f docker-compose.vps.yml down

  release:snapshot:
    desc: Build release artifacts locally without publishing
    cmds:
      - goreleaser release --snapshot --clean

  test:
    desc: Run the Go tests
    dir: stacker-server
    cmds:
      - go test ./...

