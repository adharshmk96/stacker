version: '3'

tasks:
  build:
    desc: Build the complete Stacker container image
    cmds:
      - docker build -t stacker:local .

  run:
    desc: Run Stacker locally in Docker
    cmds:
      - docker compose up --build

  nodes:up:
    desc: Start 3 local test nodes on ports 2201-2203 (stacker/stacker)
    cmds:
      - docker compose -f docker-compose.vps.yml up -d --build

  nodes:down:
    desc: Stop and remove the local test nodes
    cmds:
      - docker compose -f docker-compose.vps.yml down

  test:
    desc: Run tests in the Go build image
    cmds:
      - docker build --target server -t stacker:test .
      - docker run --rm stacker:test go test ./...

  deploy:test:
    desc: Install the current working tree on a test server
    # The steps live in the script rather than here: task runs commands through
    # its own shell, which is not bash, and the deploy needs a trap, arrays and
    # a temporary git index. Keeping it in a script also means it can be run
    # directly, and read, without going through task.
    cmds:
      - ./scripts/deploy-test.sh {{.CLI_ARGS}}
