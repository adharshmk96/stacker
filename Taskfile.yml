version: '3'

vars:
  BIN: '{{.TASK_DIR}}/bin/stacker'

tasks:
  build:ui:
    desc: Build the Nuxt UI into stacker-server/internal/web/dist for embedding
    cmds:
      - bash scripts/build-ui.sh
  
  build:
    desc: Build the stacker server binary
    dir: stacker-server
    deps: [build:ui]
    cmds:
      - go build -o '{{.BIN}}' .

  run:
    desc: Run the stacker server
    dir: stacker-server
    deps: [build:ui]
    cmds:
      - go run .

  nodes:up:
    desc: Start 3 local test nodes on ports 2201-2203 (stacker/stacker)
    cmds:
      - docker compose -f docker-compose.vps.yml up -d --build

  nodes:down:
    desc: Stop and remove the local test nodes
    cmds:
      - docker compose -f docker-compose.vps.yml down

  release:snapshot:
    desc: Build release artifacts locally without publishing
    cmds:
      - goreleaser release --snapshot --clean

  test:
    desc: Run the Go tests
    dir: stacker-server
    cmds:
      - go test ./...

