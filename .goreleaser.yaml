version: 2

project_name: stacker

# The Nuxt UI is //go:embed-ed into the binary, so it must be built and staged
# into stacker-server/internal/web/dist before any `go build` runs.
before:
  hooks:
    - bash scripts/build-ui.sh
    - go mod tidy -C stacker-server

builds:
  - id: stacker
    dir: stacker-server
    main: .
    binary: stacker
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X stacker/cmd.version={{.Version}}
      - -X stacker/cmd.commit={{.Commit}}
      - -X stacker/cmd.date={{.Date}}

archives:
  - id: stacker
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - readme.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
