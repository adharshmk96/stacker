global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: node-exporter
    dns_sd_configs:
      - names:
          - tasks.__STACKER_STACK_NAME___node-exporter
        type: A
        port: 9100

  - job_name: cadvisor
    dns_sd_configs:
      - names:
          - tasks.__STACKER_STACK_NAME___cadvisor
        type: A
        port: 8080
